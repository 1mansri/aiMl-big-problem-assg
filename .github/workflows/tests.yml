name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      # test_step4 checks the inspection app's JS rules with Node, which the runner already has
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          for t in tests/test_step*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
